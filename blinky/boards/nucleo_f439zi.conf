# NUCLEO-F439ZI blinky settings, merged on top of ../prj.conf.
#
# LED:     LD1 (green, PB0) via the led0 alias.
# Console: USART3 (PD8/PD9), the ST-LINK virtual COM port, 115200 8N1.
# Shell:   BLINKY_SHELL=usb (default): Zephyr shell over USB CDC-ACM on the
#          user USB connector CN13; see ../usb_shell/nucleo_f439zi.conf.
#          BLINKY_SHELL=uart: `version` on the ST-LINK VCP, as on the L011K4.

# No board-specific Kconfig needed.
