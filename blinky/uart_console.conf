# Minimal console command transport (BLINKY_SHELL=uart, src/blinky_uart_cmd.c).
# Used for boards without a USB device controller or the RAM for the Zephyr
# shell, and on request for any board, e.g. to use a Nucleo's ST-LINK virtual
# COM port instead of a second USB connection.
#
# Reads lines from the console UART (zephyr,console) and answers `version`
# with the same output as the shell's `version` command.

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
