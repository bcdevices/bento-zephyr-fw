# Minimal console command transport (src/blinky_uart_cmd.c), for boards
# without a USB device controller or the RAM for the Zephyr shell. Applied by
# CMakeLists.txt for boards in BLINKY_UART_CONSOLE_BOARDS.
#
# Reads lines from the console UART (zephyr,console) and answers `version`
# with the same output as the shell's `version` command.

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
