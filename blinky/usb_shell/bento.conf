# Bento settings for the USB shell transport (BLINKY_SHELL=usb), merged after
# ../usb_shell.conf.

CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Bento Blinky Shell"

# The led_strip driver logs at DBG on every strip update, which floods an
# interactive shell at 1 Hz. Compile it in at INFO instead. (Logging is only
# enabled with the USB shell transport.)
CONFIG_LED_STRIP_LOG_LEVEL_INF=y
