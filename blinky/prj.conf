# Common blinky settings.
#
# - Board-specific settings (LED backend, USB product string) live in
#   boards/<board>.conf, which Zephyr merges on top of this file.
# - The command transport is added by CMakeLists.txt: usb_shell.conf (Zephyr
#   shell over USB CDC-ACM) or, for boards without USB or enough RAM for the
#   shell, uart_console.conf (a minimal `version` command on the console UART).
# - Logging is configured in usb_shell.conf. The UART console transport is
#   for small parts and leaves it off; the boot banner and `version` use
#   printk(), which works either way.

CONFIG_GPIO=y
