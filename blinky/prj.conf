# WS2812 RGB LED via the PIO led_strip driver.
# CONFIG_WS2812_STRIP_RPI_PICO_PIO defaults y when the DT node is enabled.
CONFIG_LED_STRIP=y

# Bento2 gates the RGB LED 5V rail through a boot-on regulator (relay_5v);
# the regulator subsystem must be enabled to power the LED. Harmless on
# Bento1, which has no such regulator node.
CONFIG_REGULATOR=y

CONFIG_GPIO=y

CONFIG_LOG=y

# The led_strip driver logs at DBG on every strip update, which floods an
# interactive shell at 1 Hz. Compile it in at INFO instead.
CONFIG_LED_STRIP_LOG_LEVEL_INF=y

# Interactive shell on the physical UART. The board DTS already points both
# zephyr,console and zephyr,shell-uart at &uart1 (GP4/GP5, 115200 8N1), so no
# overlay is needed here -- only the subsystem has to be turned on.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="blinky:~$ "

# Route log output through the shell rather than straight to the console, so
# anything that does log (errors, the startup banner) does not interleave with
# whatever is being typed. The shell backend defers log output until the line
# is clear and reprints the prompt afterwards.
CONFIG_SHELL_LOG_BACKEND=y
