# WS2812 RGB LED via the PIO led_strip driver.
# CONFIG_WS2812_STRIP_RPI_PICO_PIO defaults y when the DT node is enabled.
CONFIG_LED_STRIP=y

# Bento2 gates the RGB LED 5V rail through a boot-on regulator (relay_5v);
# the regulator subsystem must be enabled to power the LED. Harmless on
# Bento1, which has no such regulator node.
CONFIG_REGULATOR=y

CONFIG_GPIO=y

CONFIG_LOG=y

# The led_strip driver logs at DBG on every strip update, which floods an
# interactive shell at 1 Hz. Compile it in at INFO instead.
CONFIG_LED_STRIP_LOG_LEVEL_INF=y

# Interactive shell, routed to a USB CDC-ACM serial port by ./app.overlay.
# The console stays on the physical UART (&uart1, GP4/GP5, 115200 8N1) via the
# board DTS, so logs and fault output survive a USB-side wedge.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="blinky:~$ "

# --- USB CDC-ACM shell transport -------------------------------------------
# These mirror app/prj.conf; see the commentary there for the reasoning behind
# each. Kept in sync deliberately, so that a USB problem reproduced on blinky
# is reproducing the same configuration the app uses.

# The USB stack and the CDC-ACM instance are brought up automatically at boot,
# so no explicit usbd_enable() is needed in application code.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Bento Blinky Shell"
CONFIG_UART_LINE_CTRL=y

# Give CDC-ACM its own workqueue instead of the shared system workqueue, so
# USB TX servicing is not delayed behind other system-workqueue items.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=2048

# NOTE: CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR is intentionally left OFF.
# With the DTR check enabled the shell suspends all TX whenever the host
# deasserts DTR; some hosts/terminals drop DTR transiently, which makes the
# shell appear to hang until DTR is reasserted.

# Shell TX ring buffer (defaults to 8 bytes, enough only for keystroke echo).
# Sized to hold a full `help` in one go. When this fills, z_shell_write() has
# to park in shell_pend_on_txdone() waiting for a TXDONE event, and that wait
# is K_FOREVER with a lost-wakeup race (see patch 0004). Patch 0004 fixes the
# race; this keeps the shell from entering that path constantly in the first
# place.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=8192

# Keep CDC-ACM logging available so the TX watchdog in patch 0003 is
# observable on the UART console when it fires. The USB stack's own INFO
# chatter stays off; only warnings and errors are compiled in.
#
# NOTE: this is only effective with CONFIG_SHELL_LOG_BACKEND=n below.
# usbd_cdc_acm.c force-#undefs its own log level to LOG_LEVEL_NONE when the
# shell is on a CDC-ACM node AND the shell log backend is enabled, emitting
# "#warning USBD_CDC_ACM_LOG_LEVEL forced to LOG_LEVEL_NONE". With the shell
# backend on, nothing this module logs can ever be compiled in.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# Compile out USB stack logging. These modules default to INFO, and the
# shell they would be reporting on is itself carried over USB -- so a USB
# fault logs through the transport that just faulted, and the log write
# re-enters the path being reported on. Off at compile time (not merely
# filtered at runtime) so no log call sites remain in the USB data path.
CONFIG_USBD_LOG_LEVEL_OFF=y

# UDC driver at ERR level so the endpoint-halt recovery is visible on the UART
# console as it happens. The driver's INFO/DBG chatter stays out.
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y

# --- Wedge diagnostics -----------------------------------------------------
# The USB shell freezes with no error and no watchdog trip, and because the
# shell is itself on USB it cannot be used to inspect a wedged board. The
# wedge monitor in main.c dumps every thread's state and pended-on wait object
# to the UART console every 5 s; these make that dump meaningful.
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Send printk() straight to the console driver instead of through the log
# subsystem. CONFIG_LOG_PRINTK defaults to y, which routes printk() into the
# deferred log pipeline -- so the wedge monitor's output would be queued behind
# the very subsystem it is meant to observe, and stays silent exactly when it
# is needed. With this off, printk() writes directly to the UART.
CONFIG_LOG_PRINTK=n

# Emit log records synchronously from the calling thread rather than queuing
# them for the log processing thread. Slower, but a deferred record that never
# gets processed is indistinguishable from a record that was never emitted.
CONFIG_LOG_MODE_IMMEDIATE=y

# Log output goes straight to the console (UART), NOT through the shell.
#
# With the shell on USB CDC-ACM, CONFIG_SHELL_LOG_BACKEND=y creates a feedback
# loop: a log record is written to the shell, the shell writes it to CDC-ACM,
# that drives USB TX, and anything logged on that path re-enters the shell.
# usbd_cdc_acm.c explicitly detects this topology (shell on cdc-acm + shell log
# backend) and force-disables its own logging to "prevent endless recursive
# logging loop" -- but that only severs the USB stack's own strand, not the
# application's.
#
# Keeping logs on the UART console breaks the loop entirely, and has the
# separate benefit that log output survives a USB wedge, which is exactly when
# it is most needed.
CONFIG_SHELL_LOG_BACKEND=n

# Temporary: force __ASSERT violations in the USB path to be loud.
# The UDC driver wraps prep_tx()/prep_rx() failures in __ASSERT, which is
# compiled out by default -- a violated assumption fails silently instead.
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_CDC_ACM_SERIAL_REMOTE_WAKEUP=y
