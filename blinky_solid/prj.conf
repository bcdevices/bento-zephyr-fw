# WS2812 RGB LED via the PIO led_strip driver.
# CONFIG_WS2812_STRIP_RPI_PICO_PIO defaults y when the DT node is enabled.
CONFIG_LED_STRIP=y

# Bento gates the RGB LED 5V rail through a boot-on regulator (relay_5v);
# the regulator subsystem must be enabled to power the LED.
CONFIG_REGULATOR=y

CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
