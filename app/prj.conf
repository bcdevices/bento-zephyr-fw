CONFIG_STDOUT_CONSOLE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_PWM=y
CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_ADC=y

# Floating point printf for sensor readings in shell output.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Interactive shell and built-in per-subsystem shell modules.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="bento:~$ "
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_ADC_SHELL=y

# Route the shell to a USB CDC-ACM serial port. The USB stack and the
# CDC-ACM instance are brought up automatically at boot, so no explicit
# usbd_enable() is needed in application code.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Bento Peripheral Shell"
CONFIG_UART_LINE_CTRL=y

# Give CDC-ACM its own workqueue instead of the shared system workqueue, so
# USB TX servicing is not delayed behind other system-workqueue items.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=2048

# NOTE: CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR is intentionally left OFF.
# With the DTR check enabled the shell suspends all TX whenever the host
# deasserts DTR; some hosts/terminals drop DTR transiently, which makes the
# shell appear to hang (CPU healthy-idle, USB still enumerated, no output)
# until DTR is reasserted. Leaving it off keeps the shell sending regardless
# of host DTR state, which is far more reliable for an interactive test shell.

# Shell TX ring buffer (defaults to 8 bytes, enough only for keystroke echo).
# The bulk of a command's output is buffered in the CDC-ACM virtual UART
# TX FIFO (sized via tx-fifo-size in app.overlay); this just needs to be
# comfortably larger than the default.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512

# PL022 SPI in interrupt mode. The default synchronous mode busy-polls the
# RX FIFO with no timeout, so a device that never clocks a response (e.g. a
# BME280 that is unpowered or mis-wired) hangs the calling thread FOREVER --
# and if that thread is the shell, the whole USB shell freezes. Interrupt
# mode waits on a completion semaphore with a length-derived timeout and
# returns -ETIMEDOUT instead, keeping the shell alive no matter what the
# peripheral does.
CONFIG_SPI_PL022_INTERRUPT=y
