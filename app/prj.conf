CONFIG_STDOUT_CONSOLE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_PWM=y
CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_ADC=y

# Floating point printf for sensor readings in shell output.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Interactive shell and built-in per-subsystem shell modules.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="bento:~$ "
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_ADC_SHELL=y

# Route the shell to a USB CDC-ACM serial port. The USB stack and the
# CDC-ACM instance are brought up automatically at boot, so no explicit
# usbd_enable() is needed in application code.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Bento Peripheral Shell"
CONFIG_UART_LINE_CTRL=y

# Hold shell output until a host terminal asserts DTR (opens the port),
# so early prompts are not lost before the USB serial port is opened.
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

# The interrupt-driven serial backend's TX ring buffer defaults to 8 bytes.
# Over USB CDC-ACM that is only enough for keystroke echo; the multi-line
# output of a command (kernel version, device list, ...) overflows it and
# the shell thread stalls waiting on a TX-ready re-arm that does not fire,
# freezing after the echo. Size the buffer to hold a full burst of output.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512
