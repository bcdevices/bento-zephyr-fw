#
# Builds the Bento demo app and blinky, plus blinky for the demo boards
# (NUCLEO-F439ZI, NUCLEO-L011K4), and archives the resulting hex images:
#
#   bento_app.hex, bento_blinky.hex
#   nucleo_f439zi_blinky.hex       USB CDC-ACM shell (default)
#   nucleo_f439zi_blinky_uart.hex  UART command on the ST-LINK VCP
#   nucleo_l011k4_blinky.hex       UART command (no USB on this part)
#
# This deliberately does NOT run inside the upstream zephyrprojectrtos/ci
# container: that image bundles every Zephyr toolchain plus Renode, the
# Arm FVPs and Rust, and does not fit in a hosted runner's ~14 GB of free
# disk. Instead the Zephyr setup action installs the "minimal" SDK with
# only the arm-zephyr-eabi toolchain.
#

name: Build Bento

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BOARD: bento

jobs:
  build:
    name: Build app + blinky (Bento and demo boards)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The west workspace is created in this directory, so the repo
          # must be checked out into a subdirectory of the workspace.
          path: bento-zephyr-fw
          # GIT-VERSION-GEN and the app_version.h generation both run
          # `git describe --tags`, which needs full history and tags.
          fetch-depth: 0

      - name: Set up Zephyr and the ARM SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1.0.15
        with:
          app-path: bento-zephyr-fw
          # SDK version is read from the Zephyr tree's SDK_VERSION file
          # (0.17.4 for Zephyr 4.3.0), keeping CI aligned with the release.
          sdk-version: auto
          toolchains: arm-zephyr-eabi

      - name: Link the west workspace into the repo
        # The Makefile resolves Zephyr from $HOME/src/zephyr-<tag>/zephyr,
        # /usr/src/zephyr-<tag>/zephyr, or ./zephyrproject/zephyr. The west
        # workspace created above puts Zephyr next to the repo instead, so
        # link it to the in-repo location the Makefile already looks for.
        # Without this, `source-zephyr` falls through to "No Zephyr" and the
        # build runs with an unset ZEPHYR_BASE.
        run: ln -s "$GITHUB_WORKSPACE" bento-zephyr-fw/zephyrproject

      - name: Generate version file
        working-directory: bento-zephyr-fw
        run: ./GIT-VERSION-GEN

      - name: Build app
        working-directory: bento-zephyr-fw
        run: make app BOARD="${BOARD}"

      - name: Build blinky
        working-directory: bento-zephyr-fw
        run: make blinky BOARD="${BOARD}"

      - name: Collect Bento artifacts
        working-directory: bento-zephyr-fw
        # The Makefile's build dir is build.<board>/<soc>/<cpucluster>.
        run: |
          set -eu
          BUILD_DIR="build.${BOARD}/rp2350b/m33"
          install -d artifacts
          install -m 644 "${BUILD_DIR}/app/zephyr/zephyr.hex" artifacts/bento_app.hex
          install -m 644 "${BUILD_DIR}/blinky/zephyr/zephyr.hex" artifacts/bento_blinky.hex

      # Demo boards build blinky only (`app` is Bento-only). Their build dir
      # is build.<board>/blinky. Each hex is copied out right after its build,
      # since the F439ZI usb and uart variants share one build directory.
      - name: Build blinky for demo boards
        working-directory: bento-zephyr-fw
        run: |
          set -eu
          build_blinky() {  # <board> <artifact name> [BLINKY_SHELL]
            make blinky BOARD="$1" ${3:+BLINKY_SHELL="$3"}
            install -m 644 "build.$1/blinky/zephyr/zephyr.hex" "artifacts/$2.hex"
          }
          build_blinky nucleo_f439zi nucleo_f439zi_blinky usb
          build_blinky nucleo_f439zi nucleo_f439zi_blinky_uart uart
          build_blinky nucleo_l011k4 nucleo_l011k4_blinky
          ls -l artifacts

      - name: Archive release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: bento-zephyr-fw/artifacts/*.hex
          if-no-files-found: error

      - name: Attach artifacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bento-zephyr-fw/artifacts/*.hex
